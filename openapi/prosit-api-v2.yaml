components:
  securitySchemes:
    sessioneLizmap:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: Sessione di Lizmap (browser). Le modifiche richiedono l'intestazione Origin dello stesso sito.
    basic:
      type: http
      scheme: basic
      description: Utente Lizmap con il diritto prosit.api.programmi. Solo HTTPS.
  parameters:
    select:
      name: select
      in: query
      schema:
        type: string
