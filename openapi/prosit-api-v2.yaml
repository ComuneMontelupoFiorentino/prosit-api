# GENERATO da bin/genera_api.py — modificare config/api.yaml
openapi: 3.0.3
info:
  title: Prosit API
  version: 2.0.0
  description: 'API REST dei servizi Prosit (segnalazioni, videosorveglianza, manomissioni, verde, illuminazione).


    Esposte da PostgREST tramite il modulo Lizmap prositapi. I permessi sono GRANT di PostgreSQL sui ruoli di gruppo, assegnati
    in base ai gruppi Lizmap dell''utente.


    **Autenticazione**: sessione Lizmap (cookie, dal browser) oppure HTTP Basic con un utente Lizmap che ha il diritto `prosit.api.programmi`
    (Amministrazione -> Diritti). Solo HTTPS.


    **Filtri** (sintassi PostgREST): `?colonna=eq.valore`, `neq`, `gt`, `gte`, `lt`, `lte`, `like`, `ilike`, `in.(a,b)`, `is.null`;
    `select=a,b`, `order=data.desc`, `limit`, `offset`. Totale: `Prefer: count=exact` (intestazione `Content-Range`).


    **Gruppi**:

    - `admins`: Amministratori (Lizmap: admins)

    - `tvcc`: Registro controlli videosorveglianza (Lizmap: admins, vigili, ced)

    - `manutentori_verde`: Manutentori del verde (esterni e interni) (Lizmap: man_verde_es, man_int)

    - `utenti`: qualunque utente Lizmap autenticato'
  contact:
    name: Prosit
servers:
- url: https://gis.comune.montelupo-fiorentino.fi.it/lizmap/api.php/prosit/v2
security:
- sessioneLizmap: []
- basic: []
tags:
- name: stato
- name: autenticazione
- name: risorse
- name: servizi
paths:
  /status:
    get:
      tags:
      - stato
      summary: Stato del servizio
      security: []
      responses:
        '200':
          description: Servizio funzionante
          content:
            application/json:
              schema:
                type: object
        '503':
          description: Servizio non disponibile
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
  /auth/me:
    get:
      tags:
      - autenticazione
      summary: Utente corrente letto da Lizmap (utente, gruppi, tipo di accesso, diritto programmi)
      responses:
        '200':
          description: Utente
          content:
            application/json:
              schema:
                type: object
        '400': &id001
          description: Richiesta non valida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '401': &id002
          description: Non autenticato
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403': &id003
          description: Permessi insufficienti
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429': &id004
          description: Troppe richieste
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
  /rpc/io:
    get:
      tags:
      - autenticazione
      summary: Utente, gruppi Lizmap e ruoli PostgreSQL effettivi
      responses:
        '200':
          description: Profilo
          content:
            application/json:
              schema:
                type: object
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
  /risorse:
    get:
      tags:
      - risorse
      summary: Risorse accessibili all'utente e operazioni consentite
      responses:
        '200':
          description: Elenco
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400': *id001
        '401': *id002
        '403': *id003
        '429': *id004
  /segnalazioni:
    get:
      tags:
      - risorse
      summary: Segnalazioni (Rekla / Twproject / Prosit)
      x-gruppi:
