# =============================================================================
# /etc/apache2/sites-available/000-default.conf — PROPOSTA per la Prosit API v2
# Rispetto alla configurazione attuale cambiano solo le righe precedute da  # <<< PROSIT
# =============================================================================
<VirtualHost *:80>
        ServerAdmin webmaster@localhost
        DocumentRoot /var/www/html

        ErrorLog ${APACHE_LOG_DIR}/lizmap_error.log
        CustomLog ${APACHE_LOG_DIR}/lizmap_access.log combined

        # Pagina iniziale del server: niente elenco dei file
        <Directory /var/www/html>
                Options -Indexes +FollowSymLinks
                AllowOverride None
                Require all granted
        </Directory>

        # Lizmap: pubblicata SOLO la cartella www, sullo stesso indirizzo /lizmap/.
        # Percorso stabile: /var/www/lizmap-web-client e' un collegamento alla versione in uso
        # (ln -sfn lizmap-web-client-3.9.12 /var/www/lizmap-web-client). Negli aggiornamenti
        # si cambia il collegamento, non Apache.  <<< PROSIT
        # <<< PROSIT
        Alias /lizmap /var/www/lizmap-web-client/lizmap/www
        # <<< PROSIT
        <Directory /var/www/lizmap-web-client/lizmap/www>
                Options -Indexes +FollowSymLinks
                AllowOverride None
                Require all granted
                DirectoryIndex index.php
                # passa a PHP l'intestazione Authorization (utenti tecnici, HTTP Basic):
                # indispensabile con PHP-FPM, innocua con mod_php  <<< PROSIT
                # <<< PROSIT
                CGIPassAuth On
        </Directory>

        # File nascosti mai serviti
        <FilesMatch "^\.">
                Require all denied
        </FilesMatch>

        # QGIS Server NON e' pubblicato: Lizmap usa Py-QGIS-Server su 127.0.0.1:7200.

        <IfModule mod_headers.c>
                Header always set X-Content-Type-Options "nosniff"
                Header always set X-Frame-Options "SAMEORIGIN"
                Header always set Referrer-Policy "strict-origin-when-cross-origin"
        </IfModule>

        # QUANDO ci sara' il certificato dell'ente (non prima): tutto su HTTPS.
        # Togliere il commento e sostituire il nome del server.  <<< PROSIT
        #Redirect permanent / https://gis.comune.montelupo-fiorentino.fi.it/
</VirtualHost>
