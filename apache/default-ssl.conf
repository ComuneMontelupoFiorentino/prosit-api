# =============================================================================
# /etc/apache2/sites-available/default-ssl.conf — PROPOSTA per la Prosit API v2
# Rispetto alla configurazione attuale cambiano solo le righe precedute da  # <<< PROSIT
# =============================================================================
<IfModule mod_ssl.c>
        <VirtualHost _default_:443>
                ServerAdmin webmaster@localhost
                DocumentRoot /var/www/html

                ErrorLog ${APACHE_LOG_DIR}/lizmap_ssl_error.log
                CustomLog ${APACHE_LOG_DIR}/lizmap_ssl_access.log combined

                <Directory /var/www/html>
                        Options -Indexes +FollowSymLinks
                        AllowOverride None
                        Require all granted
                </Directory>

                # <<< PROSIT
                Alias /lizmap /var/www/lizmap-web-client/lizmap/www
                # <<< PROSIT
                <Directory /var/www/lizmap-web-client/lizmap/www>
                        Options -Indexes +FollowSymLinks
                        AllowOverride None
                        Require all granted
                        DirectoryIndex index.php
                        # <<< PROSIT
                        CGIPassAuth On
                </Directory>

                <FilesMatch "^\.">
                        Require all denied
                </FilesMatch>

                <IfModule mod_headers.c>
                        Header always set X-Content-Type-Options "nosniff"
                        Header always set X-Frame-Options "SAMEORIGIN"
                        Header always set Referrer-Policy "strict-origin-when-cross-origin"
                        # SOLO con il certificato dell'ente: con quello autofirmato i browser
                        # non permetterebbero piu' di proseguire.  <<< PROSIT
                        #Header always set Strict-Transport-Security "max-age=31536000"
                </IfModule>

                # Protocolli sicuri (raccomandazioni AgID/ACN su TLS)  <<< PROSIT
                # <<< PROSIT
                SSLProtocol -all +TLSv1.2 +TLSv1.3

                # Certificato autofirmato: sostituire con quello dell'ente
                SSLEngine on
                SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
                SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
        </VirtualHost>
</IfModule>
